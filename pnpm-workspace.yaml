packages:
  - 'apps/*'
  - 'internal/*'
  - 'packages/*/*'
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
overrides:
  # When GitHub Actions moved to Node 24, @changesets/get-github-info breaks
  # because of its dependency on node-fetch@^2 (which is incompatible with
  # Node.js 24). Resolve to use native fetch in any node environment.
  node-fetch: npm:node-fetch-native@^1.6.0
  react: 19.2.8
  react-dom: 19.2.8
  react-is: 19.2.8
  react-test-renderer: 19.2.8
  # Oct 2026 CVE sweep. Selectors keep each vulnerable major on the patched
  # release from that line. webpack-dev-middleware 6.x has no patched release;
  # 7.4.6 still exposes the middleware API Storybook 9 calls.
  '@vitest/mocker@4': 4.1.12
  baseline-browser-mapping: 2.11.32
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  browserslist: 4.28.9
  compression: 1.8.2
  # tsup 8 requests esbuild ^0.27.0, whose newest release is still vulnerable.
  # Keep the override on that edge so Storybook can stay on esbuild 0.25.
  'tsup>esbuild': 0.28.2
  'fast-uri@3': 3.1.9
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  'nanoid@3': 3.3.20
  postcss: 8.5.31
  'postcss-selector-parser@7': 7.1.7
  sharp: 0.35.5
  source-map-js: 1.2.2
  storybook: 9.1.21
  tinypool: 2.1.2
  'undici@7': 7.30.1
  'vite@7': 7.3.7
  'vitest@4': 4.1.12
  'webpack-dev-middleware@6': 7.4.6
patchedDependencies:
  '@changesets/apply-release-plan': patches/@changesets__apply-release-plan.patch
